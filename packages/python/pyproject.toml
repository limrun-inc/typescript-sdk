[project]
name = "limrun"
version = "0.1.0"
description = "Control Limrun iOS simulators and Android emulators from Python"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "limrun-api>=0.10.0",
  "websockets>=13",
  "httpx>=0.23",
]

[project.urls]
Homepage = "https://limrun.com"
Repository = "https://github.com/limrun-inc/typescript-sdk/tree/main/packages/python"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

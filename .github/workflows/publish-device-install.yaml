name: Publish @limrun/device-install
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        working-directory: packages/device-install
        run: yarn install --frozen-lockfile
      - name: Verify package
        working-directory: packages/device-install
        run: |
          yarn lint
          yarn test
          yarn build
      - name: Publish to NPM
        working-directory: packages/device-install
        run: npm publish --provenance

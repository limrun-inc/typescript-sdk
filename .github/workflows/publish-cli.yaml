name: Publish lim CLI
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Job-level so the key survives the rebuild that `npm publish` triggers
    # through prepublishOnly; a step-level env on Build alone gets clobbered.
    env:
      LIM_POSTHOG_PROJECT_KEY: ${{ secrets.LIMRUN_POSTHOG_PROJECT_KEY }}
      LIM_POSTHOG_HOST: ${{ vars.LIMRUN_POSTHOG_HOST || 'https://l.limrun.com' }}
    steps:
      - uses: actions/checkout@v4

      # The Node set up here is also the runtime oclif bundles into the
      # tarballs: `oclif pack` uses the version of the node process running it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm OIDC trusted publishing needs npm >= 11.5; early Node 24 point
      # releases bundle an older npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Bootstrap root SDK
        run: ./scripts/bootstrap

      - name: Build root SDK
        run: ./scripts/build

      - name: Install dependencies
        working-directory: packages/cli
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: packages/cli
        run: yarn build

      # Authenticates via the npm trusted publisher configured for this
      # workflow (OIDC); a configured token would take precedence and fail.
      - name: Publish lim
        working-directory: packages/cli
        run: npm publish

      # oclif needs 7-zip to unpack the Windows Node distribution. The
      # GitHub-hosted Ubuntu image ships it; install only when missing.
      - name: Ensure 7-zip
        run: command -v 7z || sudo apt-get install -y p7zip-full

      # Bundles the CLI together with a Node runtime into one self-contained
      # tarball per platform, so users need neither Node nor npm installed.
      - name: Pack standalone tarballs
        working-directory: packages/cli
        run: npx oclif@4.24.0 pack tarballs --targets linux-x64,linux-arm64,darwin-x64,darwin-arm64,win32-x64,win32-arm64 --no-xz --parallel

      - name: Read CLI version
        id: version
        working-directory: packages/cli
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload tarballs
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lim-v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/lim-v*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/lim-v*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "lim v${{ steps.version.outputs.version }}" \
              --notes "Standalone \`lim\` CLI binaries with a bundled Node.js runtime, plus a [DotSlash](https://dotslash-cli.com/) file. Download the \`lim\` DotSlash file and run it with \`dotslash\` on your \`PATH\` (\`chmod +x\` it on macOS/Linux) — or extract a tarball for your platform and run \`lim/bin/lim\` (\`lim\\bin\\lim.cmd\` on Windows) directly."
          fi

      # Computes size/digest for each tarball and attaches the generated
      # DotSlash file (named "lim") to the release created above.
      - name: Generate and upload DotSlash file
        uses: facebook/dotslash-publish-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          config: .github/workflows/dotslash-config.json
          tag: lim-v${{ steps.version.outputs.version }}

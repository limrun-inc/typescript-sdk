name: Publish lim CLI
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm OIDC trusted publishing needs npm >= 11.5; Node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Bootstrap root SDK
        run: ./scripts/bootstrap

      - name: Build root SDK
        run: ./scripts/build

      - name: Install dependencies
        working-directory: packages/cli
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: packages/cli
        run: yarn build

      # Authenticates via the npm trusted publisher configured for this
      # workflow (OIDC); a configured token would take precedence and fail.
      - name: Publish lim
        working-directory: packages/cli
        run: npm publish

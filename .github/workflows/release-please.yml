# Runs release-please in-repo, replacing the hosted Stainless release service.
# It opens a versioned release PR for releasable commits on main; merging that
# PR creates the tag and GitHub release, and publish-npm.yml publishes from the
# release event. The app token (not GITHUB_TOKEN) is required so the PRs and
# releases it creates trigger CI and the publish workflow.
name: Release Please
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'limrun-inc/typescript-sdk'
    runs-on: ubuntu-latest

    steps:
      - name: Mint release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Open release PR or create the release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
